name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.5"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked pyright

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked pytest tests/unit_tests

  # The oldest versions pyproject.toml allows (langchain-core 1.6, httpx 0.27),
  # so a lower bound that's too low fails here. Installed with `uv pip`, not
  # from the project lock: the lock is resolved together with the dev group,
  # and langchain-tests needs httpx>=0.28.1, which would hide the httpx floor.
  # Without langchain-tests, the standard suite's file is skipped.
  lowest-dependencies:
    name: Unit tests (lowest dependencies, Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.5"
          python-version: "3.10"
      - run: uv venv
      - run: >-
          uv pip install --resolution lowest-direct -r pyproject.toml
          "pytest>=9.1.1" "pytest-asyncio>=1.4.0"
      - run: uv pip install --no-deps -e .
      - run: >-
          uv run --no-sync python -c "import langchain_core, httpx;
          print('langchain-core', langchain_core.__version__, 'httpx', httpx.__version__)"
      - run: >-
          uv run --no-sync pytest tests/unit_tests
          --ignore tests/unit_tests/test_chat_models_standard.py
