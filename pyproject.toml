[project]
name = "langchain-llama-cpp"
version = "0.1.0"
description = "An integration package connecting llama.cpp's llama-server and LangChain, with reasoning, timings, structured output and tool calling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bharathan Mudaliar", email = "bharathanmudaliar@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["langchain", "llama.cpp", "llama-server", "llama-swap", "llm", "local-llm", "chat-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "langchain-core>=1.6,<2",
]

[project.urls]
Repository = "https://github.com/bharat029/langchain-llama-cpp"
Issues = "https://github.com/bharat029/langchain-llama-cpp/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langchain-tests>=1.1.9",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

# Ruff: LangChain partner-package style (langchain-deepseek, langchain-ollama).
[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # No copyright header in every file
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "ANN401",  # Any is sometimes the honest type (**kwargs passed through)
    "TC002",   # Moving imports under TYPE_CHECKING breaks pydantic field types
    "TC003",
    "RUF012",  # Mutable class defaults: false positives on pydantic models
    "PLR0913", # Too many arguments: chat models have many parameters
    "C901",    # Complexity, branch and statement limits: single-use logic is
    "PLR0912", # inlined instead of split into helpers (as langchain-openai and
    "PLR0915", # langchain-ollama)
    "PERF203", # try/except in a loop: rarely useful (as langchain-ollama)
    "FIX002",  # TODOs are allowed
    "TD002",
    "TD003",
]
unfixable = ["B028"]  # Pick warnings' stacklevel deliberately

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "D",       # No docstrings needed in tests
    "INP001",  # tests/ is not a package
    "S101",    # Tests use assert
    "PLR2004", # Magic values in comparisons
    "SLF001",  # Private member access
    "ARG001",  # Unused fixture arguments
    "PT011",   # Broad pytest.raises
]
"notebooks/**" = ["T201", "D", "INP001", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # the langchain-tests async tests aren't marked
asyncio_default_fixture_loop_scope = "function"

# Pyright is the engine inside Pylance, so VS Code and `uv run pyright` agree.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["src"]
